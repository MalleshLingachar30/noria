name: release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: "1.26.4"
  NODE_VERSION: "24"
  CLI_BINARY: "noria"
  CLI_ENTRYPOINT: "noria"
  CLI_MODULE: "github.com/amxv/noria"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - name: Validate version and source
        run: |
          node scripts/check-release.js "$GITHUB_REF_NAME"
          go mod verify
          go test -race ./...
          go vet ./...
          npm test
          test -z "$(gofmt -l cmd internal)"
      - name: Check and build documentation
        run: |
          make docs-install
          make docs-check
          make docs-build
      - name: Inspect npm package
        run: npm pack --dry-run

  build-binaries:
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [darwin, linux, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          EXT=""
          if [ "$GOOS" = windows ]; then EXT=".exe"; fi
          VERSION="${GITHUB_REF_NAME#v}"
          go build -mod=readonly -trimpath \
            -ldflags="-s -w -X ${{ env.CLI_MODULE }}/internal/buildinfo.Version=$VERSION" \
            -o "dist/${{ env.CLI_BINARY }}_${GOOS}_${GOARCH}${EXT}" ./cmd/${{ env.CLI_ENTRYPOINT }}
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  build-menubar:
    needs: quality
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [arm64, amd64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Build signed native app and matching CLI
        shell: bash
        env:
          NORIA_VERSION: ${{ github.ref_name }}
          ARCH: ${{ matrix.arch }}
        run: |
          export NORIA_VERSION="${NORIA_VERSION#v}"
          mkdir -p stage dist
          swift_arch="$ARCH"
          if [ "$ARCH" = amd64 ]; then swift_arch=x86_64; fi
          ./apps/menubar/build.sh "$PWD/stage/Noria.app" "$swift_arch"
          CGO_ENABLED=0 GOOS=darwin GOARCH="$ARCH" go build -mod=readonly -trimpath \
            -ldflags="-s -w -X ${{ env.CLI_MODULE }}/internal/buildinfo.Version=$NORIA_VERSION" \
            -o stage/noria ./cmd/noria
          codesign --verify --deep --strict stage/Noria.app
          if [ "$(uname -m)" = "$swift_arch" ]; then
            stage/noria --version
            stage/Noria.app/Contents/MacOS/noria-menubar --check
          fi
          cp LICENSE THIRD_PARTY_NOTICES.md stage/
          COPYFILE_DISABLE=1 tar -czf "dist/noria_darwin_${ARCH}.tar.gz" -C stage noria Noria.app LICENSE THIRD_PARTY_NOTICES.md
      - uses: actions/upload-artifact@v4
        with:
          name: menubar-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  github-release:
    needs: [build-binaries, build-menubar]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Verify six binaries and two apps; generate checksums
        run: |
          test "$(find dist -maxdepth 1 -type f -name 'noria_*' ! -name '*.tar.gz' | wc -l)" -eq 6
          test "$(find dist -maxdepth 1 -type f -name 'noria_darwin_*.tar.gz' | wc -l)" -eq 2
          (cd dist && sha256sum noria_* > SHA256SUMS)
          cp LICENSE THIRD_PARTY_NOTICES.md dist/
          node scripts/release-notes.js > release-notes.md
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Noria ${{ github.ref_name }}
          body_path: release-notes.md
          files: dist/*
          fail_on_unmatched_files: true

  npm-publish:
    needs: github-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: "https://registry.npmjs.org"
      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  install-smoke:
    needs: npm-publish
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install the published package and check the native entrypoint
        shell: bash
        env:
          NORIA_REQUIRE_PREBUILT: "1"
        run: |
          node scripts/wait-registry.js "${GITHUB_REF_NAME#v}"
          npm install --global "@amxv/noria@${GITHUB_REF_NAME#v}"
          noria --version
          noria --help
