name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Go tests
        run: go test -race ./...
      - name: Go vet
        run: go vet ./...
      - name: Node installer and project tests
        run: npm test
      - name: Build
        run: go build ./cmd/noria
      - name: Real background service smoke (isolated home)
        shell: bash
        run: |
          export NORIA_SERVICE_COMPAT=1
          if [ "$RUNNER_OS" = Windows ]; then export NORIA_TEST_NORIA_BIN="$GITHUB_WORKSPACE/noria.exe"; else export NORIA_TEST_NORIA_BIN="$GITHUB_WORKSPACE/noria"; fi
          go test ./internal/app -run TestBackgroundServiceAndDirectRouting -v -count=1 -timeout 120s
      - name: Installer syntax
        shell: bash
        run: bash -n docs/public/install.sh
      - name: PowerShell installer syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'docs/public/install.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }


  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - name: Install, check and build docs serially
        run: |
          make docs-install
          make docs-check
          make docs-build

  native-menubar:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build both macOS menu architectures
        run: |
          apps/menubar/build.sh "$PWD/dist/arm64/Noria.app" arm64
          apps/menubar/build.sh "$PWD/dist/amd64/Noria.app" x86_64
          codesign --verify --deep --strict dist/arm64/Noria.app
          codesign --verify --deep --strict dist/amd64/Noria.app
