name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Go tests
        run: go test -race ./...
      - name: Go vet
        run: go vet ./...
      - name: Native installer and release tests
        shell: bash
        run: |
          set -euo pipefail
          sh -n scripts/install.sh
          diff -q scripts/install.sh docs/public/install.sh
          diff -q scripts/install.ps1 docs/public/install.ps1
          python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Build
        shell: bash
        run: |
          mkdir -p dist
          binary=dist/noria
          if [ "$RUNNER_OS" = Windows ]; then binary=dist/noria.exe; fi
          go build -o "$binary" ./cmd/noria
      - name: Background service smoke (isolated state)
        env:
          NORIA_TEST_SKIP_LOGIN: "1"
        run: python3 scripts/test-service-smoke.py
      - name: Windows PowerShell installer syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'scripts/install.ps1'), [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - name: Install, check and build docs serially
        run: |
          make docs-install
          make docs-check
          make docs-build

  native-menu:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"
          cache: true
      - name: Compile both menu bar architectures
        run: |
          mkdir -p dist
          go build -o dist/noria ./cmd/noria
          ./apps/menubar/build.sh "$PWD/dist/Noria.app" "$(uname -m)"
          dist/Noria.app/Contents/MacOS/noria-menubar --check
          dist/Noria.app/Contents/MacOS/noria-menubar --validate-status-json apps/menubar/Tests/status.json
          ./apps/menubar/build.sh "$PWD/dist/Noria-intel.app" x86_64
          ./apps/menubar/build.sh "$PWD/dist/Noria-arm.app" arm64
      - name: Verify service start and direct restoration
        run: python3 scripts/test-service-smoke.py
